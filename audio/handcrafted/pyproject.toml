[project]
name = "m1-audio-handcrafted"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "MasterHrit", email = "agarwal.hritik225@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.6.0",
    "librosa>=0.11.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "python-dateutil>=2.9.0.post0",
    "pywavelets>=1.9.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "soundfile>=0.14.0",
]

[project.scripts]
m1-audio-handcrafted = "m1_audio_handcrafted:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.4",
    "tqdm>=4.70.1",
]
